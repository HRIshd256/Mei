<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meivazhi Saalai - Calendar</title>
    <link rel="stylesheet" href="square-calendar.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="logo">Meivazhi Saalai</div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="vedams.html">Vedams</a></li>
                    <li><a href="festivals.html">Festivals</a></li>
                    <li><a href="bus-timings.html">Bus Timings</a></li>
                    <li><a href="mp3.html">MP3</a></li>
                    <li><a href="images.html">Images</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="calendar-container">
        <div class="calendar-header">
            <button id="prev-year" class="year-nav">&lt;</button>
            <h1 id="current-year">2025</h1>
            <button id="next-year" class="year-nav">&gt;</button>
        </div>
        
        <div class="calendar-grid">
            <div class="month-grid">
                <!-- Months will be dynamically generated -->
            </div>
        </div>

        <div id="festival-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Upcoming Festivals</h2>
                <div id="festival-list"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 Meivazhi Saalai</p>
    </footer>

    <script src="square-calendar.js"></script>
</body>
</html>
